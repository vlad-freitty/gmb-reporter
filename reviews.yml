name: GBP Reviews Watch

on:
  schedule:
    - cron: '*/5 * * * *'      # кожні 5 хвилин
  workflow_dispatch:            # + кнопка "Run workflow" вручну
    inputs:
      mode:
        description: 'Режим: пусто = звичайний цикл. Варіанти: --accounts, --locations, --dry-run, --init'
        required: false
        default: ''

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run watcher
        env:
          GBP_CLIENT_ID:     ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID:    ${{ secrets.GBP_ACCOUNT_ID }}
          TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}
        run: python gbp_reviews_watch.py ${{ github.event.inputs.mode }}

      - name: Save state
        if: always()
        run: |
          git config user.name  "gbp-bot"
          git config user.email "gbp-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --quiet --cached || git commit -m "state $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push || true
